name: Web CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build
